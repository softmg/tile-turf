  - id: step-5
    title: Harden Pixi lifecycle and asset loading
    branch: fix/pixi-lifecycle-assets
    status: done
    request: >-
      Apply the PixiJS v8 lifecycle findings from the audit. In `src/components/IsoGrid.tsx`, wrap the full async
      `Application.init` plus `Assets.load` sequence in recoverable error handling, avoid unhandled asset-load
      rejections, and make destroyed/unmounted races explicit. Replace `app.destroy(true, { children: true })` with the
      v8 destroy shape that removes the canvas and releases global renderer resources during round/app teardown:
      `app.destroy({ removeView: true, releaseGlobalResources: true }, { children: true })`. Keep cached game textures
      only if that is intentional; otherwise unload abandoned assets. Move texture options such as scale mode and mipmap
      generation into `Assets.load` descriptors where possible instead of mutating `texture.source` after load. Remove
      or dev-gate routine Pixi console logs. Verify by repeatedly starting/ending rounds and hot-reloading without
      console errors, stale canvases, or texture flicker.
    continueMessage: >-
      Continue only the Pixi lifecycle and asset-loading hardening. Preserve gameplay behavior and validate repeated
      mount/unmount, round restart, and browser console cleanliness before moving on.
