  - id: step-6
    title: Fix Pixi input and mobile touch handling
    branch: fix/pixi-input-touch
    status: done
    request: >-
      Fix the Pixi event/input risks found in the audit. Use `globalpointermove` for joystick dragging so movement does
      not stop when the pointer leaves the stage hit area, handle `pointercancel` consistently, and reset drag state
      when pause/tutorial/game-over modals open. Prevent two-finger pinch zoom from also starting or continuing the Pixi
      joystick gesture by tracking active touch pointers or an explicit pinch-active flag. Recheck `app.stage` `hitArea`
      after Pixi resizes and after viewport changes. Smoke test keyboard movement, pointer/touch movement, pinch zoom,
      pause/resume, and mobile viewport behavior with no console warnings.
    continueMessage: >-
      Continue only the Pixi input/touch fixes. Keep desktop keyboard controls, mobile joystick, pinch zoom, and modal
      pause behavior intact.
